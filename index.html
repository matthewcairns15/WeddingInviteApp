<!DOCTYPE html>
<html lang="en">

  <!-- Add this at the top of your index.html -->
  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';
    window.supabase = { createClient }; // make it globally accessible
  </script>

  <!--Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!--Init Supabase-->
  <script src="supabase.js"></script> 

  <head>
    <meta charset="UTF-8">
    <title>Wedding RSVP</title>

      <link
    rel="stylesheet"
      href="./CSS/main.css"
      />

    <style>
      .invitee { margin-bottom: 10px; }
      label { margin-right: 10px; font-weight: bold; }
    </style>
  </head>
  <body>
    <div class="page-wrapper">

      <div id="inviteesContainer">

        <div class="invite-card">
          <div class="invite-left">
            <img src="img/doves.png" class="icon">
            <img src="img/cake.png" class="icon">
            <img src="img/glasses.png" class="icon">
          </div>

          <div class="invite-content">
            <h1>You're invited to the wedding of</h1>
            <h2>Matt + Paida</h2>
            <p>31.12.2027</p>
            <p>Strathaven Hotel</p>
          </div>
          
          <div class="invite-content">
            <h1>RSVP</h1>
            <div id="invitee-names"></div>
            <button id="submitRSVP">
              <span id="btnText">Submit</span>
              <span id="btnSpinner" class="hidden"></span>
              <span aria-hidden="true"></span>
            </button>
          </div>
        </div>

        <div class="bottom-decor">
          <img src="img/Bottom_mobile_photo_1.png" alt="">
        </div>
         <div class="bottom-decor">
          <img src="img/Bottom_mobile_photo_1.png" alt="">
        </div>


      </div>
    </div>
    <script src="./JS/index.js"></script>
  </body>
</html>
