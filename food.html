<!DOCTYPE html>
<html lang="en">

<!-- Add this at the top of your index.html -->
<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';
  window.supabase = { createClient }; // make it globally accessible
</script>

<!--Supabase SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!--Init Supabase-->
<script src="supabase.js"></script> 

<head>
  <meta charset="UTF-8">
  <title>Plans</title>

  <!-- Swiper CSS -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.css"
  />

 
  <link
  rel="stylesheet"
    href="./CSS/main.css"
    />

</head>


  <body>
    <div class="page-wrapper">
      <!-- Swiper -->
      <div class="swiper mySwiper">
      <div class="swiper-wrapper">
        <div class="swiper-slide">
          <img src="img/menu1.png" class="menu-img">
        </div>

        <div class="swiper-slide">
          <img src="img/menu2.png" class="menu-img">
        </div>

        <div class="swiper-slide">
          <img src="img/menu3.png" class="menu-img">
        </div>
      </div>

      <div class="swiper-button-next"></div>
      <div class="swiper-button-prev"></div>
      <div class="swiper-pagination"></div>
    </div>

      <!-- Swiper JS -->
      <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>

      <!-- Initialize Swiper -->
      <script>
        var swiper = new Swiper(".mySwiper", {
          pagination: {
            el: ".swiper-pagination",
            type: "progressbar",
          },
          navigation: {
            nextEl: ".swiper-button-next",
            prevEl: ".swiper-button-prev",
          },
        });
      </script>

      <div class="food-wrapper">
        <h1>Food Selection</h1>
        <div id="foodContainer"></div>
        <button id="submitFood">
            <span id="btnText">Submit</span>
            <span id="btnSpinner" class="hidden"></span>
            <span aria-hidden="true"></span>
        </button>
      </div>

      <script src="./JS/food.js"></script>

      </div>
  </body>
</html>
