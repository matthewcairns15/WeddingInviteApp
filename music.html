<!DOCTYPE html>
<html lang="en">

  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Init Supabase -->
  <script src="supabase.js"></script>

  <head>
    <meta charset="UTF-8">
    <title>Music Requests</title>

      <link
    rel="stylesheet"
      href="./CSS/main.css"
      />
  </head>
  <body>
    <div class="page-wrapper">

      <h1>Music Requests</h1>

      <label for="songInput">Enter your song request + Artist (optional):</label>
      <input type="text" id="songInput" placeholder="Song name or artist">

      <button id="submitMusic">Add Song</button>

      <h2>Current RSVP Data:</h2>
      <pre id="rsvpDisplay">{}</pre>

      <button id="btnFinish">
         <span id="btnText">Finish and Submit Options</span>
         <span id="btnSpinner" class="spinner hidden"></span>
      </button>

      <script src="./JS/music.js"></script>
    </div>
  </body>
</html>
